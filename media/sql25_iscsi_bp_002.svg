<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7B8C"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 24px; font-weight: 700; fill: #003366; }
    .sub { font-size: 14px; fill: #4A5A6A; }
    .hdr { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .col { font-size: 14px; font-weight: 700; fill: #003366; }
    .t { font-size: 13px; fill: #1F2D3D; }
    .tb { font-size: 13.5px; font-weight: 700; fill: #1F2D3D; }
    .ts { font-size: 11.5px; fill: #4A5A6A; }
    .tw { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="40" y="40" class="title">Storage layout: SQL Server files to Windows volumes, LUNs, FlexVol volumes and nodes</text>
  <text x="40" y="64" class="sub">One LUN per FlexVol volume and one volume per file type · all LUNs mapped to igroup sql-iscsi-1 · LUN format windows_2008</text>

  <!-- column headers -->
  <text x="140" y="110" class="col" text-anchor="middle">SQL Server files</text>
  <text x="400" y="110" class="col" text-anchor="middle">Windows volume (NTFS, GPT)</text>
  <text x="660" y="110" class="col" text-anchor="middle">ONTAP LUN</text>
  <text x="920" y="110" class="col" text-anchor="middle">FlexVol volume</text>
  <text x="1105" y="110" class="col" text-anchor="middle">Node</text>

  <!-- rows: y = 130, 250, 370, 490 -->
  <!-- Row 1 data -->
  <rect x="40" y="130" width="200" height="90" rx="6" fill="#0067C5"/>
  <text x="140" y="162" class="tw" text-anchor="middle">User databases</text>
  <text x="140" y="182" class="tw" text-anchor="middle" style="font-weight:400">*.mdf, *.ndf</text>
  <text x="140" y="202" class="tw" text-anchor="middle" style="font-weight:400">E:\data</text>
  <rect x="300" y="130" width="200" height="90" rx="6" fill="#EAF3FC" stroke="#0067C5" stroke-width="1.5"/>
  <text x="400" y="165" class="tb" text-anchor="middle">E:  "data"</text>
  <text x="400" y="187" class="t" text-anchor="middle">Disk 1 · 520 GB</text>
  <text x="400" y="207" class="ts" text-anchor="middle">64 KB allocation unit (recommended)</text>
  <rect x="560" y="130" width="200" height="90" rx="6" fill="#FFF6E5" stroke="#E08A00" stroke-width="1.5"/>
  <text x="660" y="165" class="tb" text-anchor="middle">sql_iscsi_1_data_1</text>
  <text x="660" y="187" class="t" text-anchor="middle">520 GiB · LUN ID 0</text>
  <text x="660" y="207" class="ts" text-anchor="middle">thin, space-allocation on</text>
  <rect x="820" y="130" width="200" height="90" rx="6" fill="#F2F4F7" stroke="#6B7B8C" stroke-width="1.5"/>
  <text x="920" y="165" class="tb" text-anchor="middle">sql_iscsi_1_data</text>
  <text x="920" y="187" class="t" text-anchor="middle">snapshot policy none</text>
  <text x="920" y="207" class="ts" text-anchor="middle">backups by NetApp Console</text>
  <rect x="1060" y="150" width="100" height="50" rx="5" fill="#003366"/>
  <text x="1110" y="180" class="tw" text-anchor="middle">A50-01</text>

  <!-- Row 2 log -->
  <rect x="40" y="250" width="200" height="90" rx="6" fill="#0067C5"/>
  <text x="140" y="282" class="tw" text-anchor="middle">Transaction logs</text>
  <text x="140" y="302" class="tw" text-anchor="middle" style="font-weight:400">*.ldf</text>
  <text x="140" y="322" class="tw" text-anchor="middle" style="font-weight:400">F:\log</text>
  <rect x="300" y="250" width="200" height="90" rx="6" fill="#EAF3FC" stroke="#0067C5" stroke-width="1.5"/>
  <text x="400" y="285" class="tb" text-anchor="middle">F:  "log"</text>
  <text x="400" y="307" class="t" text-anchor="middle">Disk 2 · 250 GB</text>
  <text x="400" y="327" class="ts" text-anchor="middle">64 KB allocation unit (recommended)</text>
  <rect x="560" y="250" width="200" height="90" rx="6" fill="#FFF6E5" stroke="#E08A00" stroke-width="1.5"/>
  <text x="660" y="285" class="tb" text-anchor="middle">sql_iscsi_1_log_1</text>
  <text x="660" y="307" class="t" text-anchor="middle">250 GiB · LUN ID 1</text>
  <text x="660" y="327" class="ts" text-anchor="middle">thin, space-allocation on</text>
  <rect x="820" y="250" width="200" height="90" rx="6" fill="#F2F4F7" stroke="#6B7B8C" stroke-width="1.5"/>
  <text x="920" y="285" class="tb" text-anchor="middle">sql_iscsi_1_log</text>
  <text x="920" y="307" class="t" text-anchor="middle">snapshot policy none</text>
  <text x="920" y="327" class="ts" text-anchor="middle">backups by NetApp Console</text>
  <rect x="1060" y="270" width="100" height="50" rx="5" fill="#003366"/>
  <text x="1110" y="300" class="tw" text-anchor="middle">A50-02</text>

  <!-- Row 3 tempdb -->
  <rect x="40" y="370" width="200" height="90" rx="6" fill="#0067C5"/>
  <text x="140" y="402" class="tw" text-anchor="middle">TempDB (8 files)</text>
  <text x="140" y="422" class="tw" text-anchor="middle" style="font-weight:400">G:\tempdb\data</text>
  <text x="140" y="442" class="tw" text-anchor="middle" style="font-weight:400">G:\tempdb\log</text>
  <rect x="300" y="370" width="200" height="90" rx="6" fill="#EAF3FC" stroke="#0067C5" stroke-width="1.5"/>
  <text x="400" y="405" class="tb" text-anchor="middle">G:  "tempdb"</text>
  <text x="400" y="427" class="t" text-anchor="middle">Disk 3 · 150 GB</text>
  <text x="400" y="447" class="ts" text-anchor="middle">64 KB allocation unit (recommended)</text>
  <rect x="560" y="370" width="200" height="90" rx="6" fill="#FFF6E5" stroke="#E08A00" stroke-width="1.5"/>
  <text x="660" y="405" class="tb" text-anchor="middle">sql_iscsi_1_tempdb_1</text>
  <text x="660" y="427" class="t" text-anchor="middle">150 GiB · LUN ID 2</text>
  <text x="660" y="447" class="ts" text-anchor="middle">thin, space-allocation on</text>
  <rect x="820" y="370" width="200" height="90" rx="6" fill="#F2F4F7" stroke="#6B7B8C" stroke-width="1.5"/>
  <text x="920" y="405" class="tb" text-anchor="middle">sql_iscsi_1_tempdb</text>
  <text x="920" y="427" class="t" text-anchor="middle">snapshot policy none</text>
  <text x="920" y="447" class="ts" text-anchor="middle">never backed up</text>
  <rect x="1060" y="390" width="100" height="50" rx="5" fill="#003366"/>
  <text x="1110" y="420" class="tw" text-anchor="middle">A50-02</text>

  <!-- Row 4 backup -->
  <rect x="40" y="490" width="200" height="90" rx="6" fill="#0067C5"/>
  <text x="140" y="522" class="tw" text-anchor="middle">Native backups</text>
  <text x="140" y="542" class="tw" text-anchor="middle" style="font-weight:400">*.bak, *.trn</text>
  <text x="140" y="562" class="tw" text-anchor="middle" style="font-weight:400">H:\backup</text>
  <rect x="300" y="490" width="200" height="90" rx="6" fill="#EAF3FC" stroke="#0067C5" stroke-width="1.5"/>
  <text x="400" y="525" class="tb" text-anchor="middle">H:  "Log backup"</text>
  <text x="400" y="547" class="t" text-anchor="middle">Disk 4 · 300 GB</text>
  <text x="400" y="567" class="ts" text-anchor="middle">64 KB allocation unit (recommended)</text>
  <rect x="560" y="490" width="200" height="90" rx="6" fill="#FFF6E5" stroke="#E08A00" stroke-width="1.5"/>
  <text x="660" y="525" class="tb" text-anchor="middle">sql_iscsi_1_logbackup_1</text>
  <text x="660" y="547" class="t" text-anchor="middle">300 GiB · LUN ID 3</text>
  <text x="660" y="567" class="ts" text-anchor="middle">thin, space-allocation on</text>
  <rect x="820" y="490" width="200" height="90" rx="6" fill="#F2F4F7" stroke="#6B7B8C" stroke-width="1.5"/>
  <text x="920" y="525" class="tb" text-anchor="middle">sql_iscsi_1_logbackup</text>
  <text x="920" y="547" class="t" text-anchor="middle">snapshot policy none</text>
  <text x="920" y="567" class="ts" text-anchor="middle">log backup target</text>
  <rect x="1060" y="510" width="100" height="50" rx="5" fill="#003366"/>
  <text x="1110" y="540" class="tw" text-anchor="middle">A50-01</text>

  <!-- connectors -->
  <g stroke="#6B7B8C" stroke-width="2" marker-end="url(#arrg)">
    <line x1="240" y1="175" x2="298" y2="175"/><line x1="500" y1="175" x2="558" y2="175"/><line x1="760" y1="175" x2="818" y2="175"/><line x1="1020" y1="175" x2="1058" y2="175"/>
    <line x1="240" y1="295" x2="298" y2="295"/><line x1="500" y1="295" x2="558" y2="295"/><line x1="760" y1="295" x2="818" y2="295"/><line x1="1020" y1="295" x2="1058" y2="295"/>
    <line x1="240" y1="415" x2="298" y2="415"/><line x1="500" y1="415" x2="558" y2="415"/><line x1="760" y1="415" x2="818" y2="415"/><line x1="1020" y1="415" x2="1058" y2="415"/>
    <line x1="240" y1="535" x2="298" y2="535"/><line x1="500" y1="535" x2="558" y2="535"/><line x1="760" y1="535" x2="818" y2="535"/><line x1="1020" y1="535" x2="1058" y2="535"/>
  </g>
  <text x="40" y="620" class="ts">System databases (master, model, msdb) and the SQL Server binaries remain on the local disk C:. LUN IDs are assigned in creation order.</text>
</svg>
